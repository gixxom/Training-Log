<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>운동 기록장</title>

  <!-- 아이폰 홈 화면 전용 앱 아이콘 -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <meta name="apple-mobile-web-app-title" content="운동 기록장">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    /* 기본 라이트 모드 컬러 */
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-main: #333333;
      --text-sub: #4a5568;
      --border-color: #cbd5e0;
      --input-bg: #ffffff;
      --input-text: #333333;
      --header-bg: #f8fafc;
      --header-text: #2b6cb0;
      --badge-bg: #3182ce;
      --item-bg: #faf5ff;
      --item-border: #e9d8fd;
      --item-title: #2d3748;
      --item-detail: #6b46c1;
      --month-box: #edf2f7;
      --month-text: #2d3748;
      --recent-bg: #ebf8ff;
      --recent-border: #bee3f8;
      --recent-text: #2b6cb0;
    }

    /* 다크 모드 컬러 (시스템 설정이 어두운 모드일 때 자동 적용) */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #121212;
        --card-bg: #1e1e1e;
        --text-main: #e0e0e0;
        --text-sub: #a0aec0;
        --border-color: #4a5568;
        --input-bg: #2d2d2d;
        --input-text: #ffffff;
        --header-bg: #2a2a2a;
        --header-text: #63b3ed;
        --badge-bg: #2b6cb0;
        --item-bg: #251f30;
        --item-border: #44337a;
        --item-title: #e2e8f0;
        --item-detail: #b794f4;
        --month-box: #2a2a2a;
        --month-text: #e2e8f0;
        --recent-bg: #1a365d;
        --recent-border: #2c5282;
        --recent-text: #90cdf4;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px 12px; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
    .header-title { text-align: center; margin-bottom: 16px; color: var(--text-main); }
    .header-title h1 { font-size: 1.4rem; font-weight: 700; }
    .app-layout { display: flex; flex-direction: column; gap: 16px; max-width: 480px; margin: 0 auto; }
    .card { background: var(--card-bg); padding: 18px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .card h2 { font-size: 1.1rem; color: var(--text-main); margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1.5px solid var(--border-color); }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text-sub); }
    input, select { width: 100%; height: 48px; padding: 0 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; background-color: var(--input-bg); color: var(--input-text); -webkit-appearance: none; }
    input:focus, select:focus { outline: none; border-color: #4a90e2; box-shadow: 0 0 0 2px rgba(74,144,226,0.2); }
    
    /* 분리된 입력 칸 레이아웃 */
    .input-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .input-unit-wrapper { position: relative; }
    .input-unit-wrapper input { padding-right: 36px; text-align: right; font-weight: 600; }
    .input-unit { position: absolute; right: 8px; top: 14px; font-size: 0.85rem; color: var(--text-sub); pointer-events: none; font-weight: 600; }

    /* 최근 기록 불러오기 영역 */
    .recent-load-box { display: none; background: var(--recent-bg); border: 1px solid var(--recent-border); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; align-items: center; justify-content: space-between; }
    .recent-info { font-size: 0.8rem; color: var(--recent-text); font-weight: 600; }
    .btn-load { width: auto; height: 32px; padding: 0 10px; font-size: 0.75rem; background-color: #3182ce; color: #fff; margin-top: 0; border-radius: 6px; white-space: nowrap; border: none; cursor: pointer; }

    button { width: 100%; height: 50px; background-color: #4a90e2; color: white; border: none; border-radius: 8px; font-size: 1.05rem; font-weight: 700; cursor: pointer; margin-top: 6px; }
    button:disabled { background-color: #a0aec0; cursor: not-allowed; }
    .btn-cancel { background-color: #e53e3e; margin-top: 8px; }

    /* 월 이동 컨트롤 */
    .month-picker-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: var(--month-box); padding: 8px 12px; border-radius: 8px; }
    .month-picker-container button { width: auto; height: 32px; padding: 0 10px; font-size: 0.85rem; margin: 0; background-color: #718096; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    .month-display { font-size: 1rem; font-weight: 700; color: var(--month-text); }

    /* 날짜별 아코디언 그룹 */
    .record-list-container { max-height: 480px; overflow-y: auto; padding-right: 2px; }
    .date-group { border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 10px; overflow: hidden; background: var(--card-bg); }
    .date-header { background: var(--header-bg); padding: 12px 14px; font-weight: 700; font-size: 0.95rem; color: var(--header-text); display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-bottom: 1px solid transparent; }
    .date-group.open .date-header { border-bottom-color: var(--border-color); }
    .badge { background: var(--badge-bg); color: #fff; font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; font-weight: 600; }
    
    .date-body { display: none; padding: 10px; background: var(--card-bg); }
    .date-group.open .date-body { display: block; }
    
    .workout-item { background: var(--item-bg); border: 1px solid var(--item-border); padding: 10px 12px; border-radius: 6px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .workout-item:last-child { margin-bottom: 0; }
    .workout-info { display: flex; flex-direction: column; gap: 2px; }
    .workout-title { font-weight: 700; font-size: 0.95rem; color: var(--item-title); }
    .workout-detail { font-size: 0.85rem; color: var(--item-detail); font-weight: 600; }
    
    .btn-group { display: flex; gap: 6px; align-items: center; }
    .btn-sm { width: auto; height: 30px; padding: 0 8px; font-size: 0.75rem; font-weight: 600; border-radius: 6px; margin-top: 0; border: none; color: #fff; cursor: pointer; }
    .btn-edit { background-color: #ed8936; }
    .btn-del { background-color: #e53e3e; }
    .status-msg { text-align: center; color: var(--text-sub); font-size: 0.85rem; padding: 24px 0; }
  </style>
</head>
<body>

<div class="header-title">
  <h1>🏋️‍♂️ 오늘의 운동 기록장</h1>
</div>

<div class="app-layout">
  <!-- 기록 작성 카드 -->
  <div class="card">
    <h2 id="formTitle">✍️ 기록 작성하기</h2>
    <form id="workoutForm">
      <input type="hidden" id="editRowIndex" value="">
      <div class="form-group">
        <label for="date">날짜</label>
        <input type="date" id="date" required>
      </div>
      
      <div class="form-group">
        <label for="workoutType">운동 종류</label>
        <select id="workoutType" required>
          <option value="" disabled selected>운동을 선택하세요</option>
          <option value="덤벨 루마니안 데드리프트" data-category="dumbbell">덤벨 루마니안 데드리프트</option>
          <option value="덤벨 벤치프레스" data-category="dumbbell">덤벨 벤치프레스</option>
          <option value="덤벨숄더프레스" data-category="dumbbell">덤벨숄더프레스</option>
          <option value="덤벨컬" data-category="dumbbell">덤벨컬</option>
          <option value="렛풀다운" data-category="pin">렛풀다운</option>
          <option value="레그 프레스" data-category="machine">레그 프레스</option>
          <option value="바벨로우" data-category="barbell">바벨로우</option>
          <option value="벤트오버 레터럴 레이즈" data-category="dumbbell">벤트오버 레터럴 레이즈</option>
          <option value="벤치프레스" data-category="barbell">벤치프레스</option>
          <option value="사이드 레터럴 레이즈(사레레)" data-category="dumbbell">사이드 레터럴 레이즈(사레레)</option>
          <option value="사이클" data-category="cardio">사이클</option>
          <option value="스미스 스쿼트" data-category="machine">스미스 스쿼트</option>
          <option value="스미스 OHP" data-category="machine">스미스 OHP</option>
          <option value="스미스 인클라인 벤치프레스" data-category="machine">스미스 인클라인 벤치프레스</option>
          <option value="시티드 니업" data-category="bodyweight">시티드 니업</option>
          <option value="오버헤드 익스텐션" data-category="dumbbell">오버헤드 익스텐션</option>
          <option value="원 암 덤벨로우" data-category="dumbbell">원 암 덤벨로우</option>
          <option value="인클라인 덤벨 벤치프레스" data-category="dumbbell">인클라인 덤벨 벤치프레스</option>
          <option value="체스트 플라이" data-category="pin">체스트 플라이</option>
          <option value="케이블 암풀다운" data-category="pin">케이블 암풀다운</option>
          <option value="케이블 푸쉬다운" data-category="pin">케이블 푸쉬다운</option>
          <option value="턱걸이" data-category="bodyweight">턱걸이</option>
          <option value="해머컬" data-category="dumbbell">해머컬</option>
          <option value="행잉레그레이즈" data-category="bodyweight">행잉레그레이즈</option>
        </select>
      </div>

      <!-- 최근 기록 불러오기 알림 영역 -->
      <div class="recent-load-box" id="recentLoadBox">
        <div class="recent-info">
          <span>최근 기록: <strong id="recentDetailText">-</strong></span>
        </div>
        <button type="button" class="btn-load" id="btnLoadRecent">⚡ 불러오기</button>
      </div>

      <!-- 수동 입력 영역 -->
      <div class="form-group">
        <label id="detailLabel">운동량 (수동 입력)</label>
        <div class="input-grid">
          <div class="input-unit-wrapper">
            <input type="number" id="weightInput" step="any" placeholder="0" inputmode="decimal">
            <span class="input-unit" id="weightUnit">kg</span>
          </div>
          <div class="input-unit-wrapper">
            <input type="number" id="repsInput" pattern="\d*" placeholder="0" inputmode="numeric">
            <span class="input-unit">회</span>
          </div>
          <div class="input-unit-wrapper">
            <input type="number" id="setsInput" pattern="\d*" placeholder="0" inputmode="numeric">
            <span class="input-unit">세트</span>
          </div>
        </div>
      </div>

      <button type="submit" id="submitBtn">기록 추가하기</button>
      <button type="button" id="cancelBtn" class="btn-cancel" style="display: none;">수정 취소</button>
    </form>
  </div>

  <!-- 월별 목록 카드 -->
  <div class="card">
    <h2>📋 월별 운동 일지 목록</h2>
    
    <div class="month-picker-container">
      <button type="button" id="prevMonthBtn">◀ 이전달</button>
      <span class="month-display" id="monthDisplay"></span>
      <button type="button" id="nextMonthBtn">다음달 ▶</button>
    </div>

    <div class="record-list-container" id="workoutList">
      <p class="status-msg">구글 시트에서 데이터를 불러오는 중...</p>
    </div>
  </div>
</div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbyTvkE9a03gHs5HRkTQQ1l3ZSndeMOfPMP5HjFuUXasJUmxox2V_xWIsBLzBtCOzD3A/exec';

  const form = document.getElementById('workoutForm');
  const workoutList = document.getElementById('workoutList');
  const submitBtn = document.getElementById('submitBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const dateInput = document.getElementById('date');
  const workoutTypeSelect = document.getElementById('workoutType');
  
  const weightInput = document.getElementById('weightInput');
  const repsInput = document.getElementById('repsInput');
  const setsInput = document.getElementById('setsInput');
  const weightUnit = document.getElementById('weightUnit');
  
  const recentLoadBox = document.getElementById('recentLoadBox');
  const recentDetailText = document.getElementById('recentDetailText');
  const btnLoadRecent = document.getElementById('btnLoadRecent');

  const detailLabel = document.getElementById('detailLabel');
  const formTitle = document.getElementById('formTitle');
  const editRowIndexInput = document.getElementById('editRowIndex');

  const monthDisplay = document.getElementById('monthDisplay');
  const prevMonthBtn = document.getElementById('prevMonthBtn');
  const nextMonthBtn = document.getElementById('nextMonthBtn');

  let currentRecords = [];
  let currentDate = new Date();
  let isSubmitting = false;
  let tempRecentData = null;

  function getTodayString() {
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  dateInput.value = getTodayString();

  function saveFormDraft() {
    const draft = {
      type: workoutTypeSelect.value,
      weight: weightInput.value,
      reps: repsInput.value,
      sets: setsInput.value
    };
    localStorage.setItem('workout_form_draft', JSON.stringify(draft));
  }

  function loadFormDraft() {
    const saved = localStorage.getItem('workout_form_draft');
    if (saved) {
      try {
        const draft = JSON.parse(saved);
        if (draft.type) {
          workoutTypeSelect.value = draft.type;
          workoutTypeSelect.dispatchEvent(new Event('change'));
        }
        if (draft.weight !== undefined) weightInput.value = draft.weight;
        if (draft.reps !== undefined) repsInput.value = draft.reps;
        if (draft.sets !== undefined) setsInput.value = draft.sets;
      } catch (e) {
        console.error('Draft load error:', e);
      }
    }
  }

  dateInput.addEventListener('input', saveFormDraft);
  workoutTypeSelect.addEventListener('change', saveFormDraft);
  weightInput.addEventListener('input', saveFormDraft);
  repsInput.addEventListener('input', saveFormDraft);
  setsInput.addEventListener('input', saveFormDraft);

  function updateMonthDisplay() {
    const year = currentDate.getFullYear();
    const month = String(currentDate.getMonth() + 1).padStart(2, '0');
    monthDisplay.textContent = `${year}년 ${month}월`;
  }

  prevMonthBtn.addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    updateMonthDisplay();
    renderRecords();
  });

  nextMonthBtn.addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    updateMonthDisplay();
    renderRecords();
  });

  workoutTypeSelect.addEventListener('change', (e) => {
    const selectedType = e.target.value;
    const selectedOption = e.target.options[e.target.selectedIndex];
    const category = selectedOption ? selectedOption.getAttribute('data-category') : null;

    if (category === 'dumbbell') {
      detailLabel.textContent = '운동량 (한쪽 덤벨 무게)';
      weightUnit.textContent = 'kg';
    } else if (category === 'barbell') {
      detailLabel.textContent = '운동량 (양쪽 원판합, 봉제외)';
      weightUnit.textContent = 'kg';
    } else if (category === 'machine') {
      detailLabel.textContent = '운동량 (머신 무게)';
      weightUnit.textContent = 'kg';
    } else if (category === 'pin') {
      detailLabel.textContent = '운동량 (핀 꽂는 번호)';
      weightUnit.textContent = '핀';
    } else if (category === 'cardio') {
      detailLabel.textContent = '운동
